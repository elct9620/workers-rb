# The cluster SPEC.md F-08 describes, shrunk onto one machine: several Nodes
# behind one entry point, all serving the same shared directory, exactly one of
# them designated the Writer.
x-node: &node
  build: .
  image: workers-rb
  environment: &node-environment
    # A Tenant answers at `<tenant>.workers.test` as well as at `/<tenant>`,
    # so both routing forms can be shown without owning a real domain.
    WORKERS_BASE_DOMAIN: workers.test
  volumes:
    # Tenants are published by placing files, so the directory is mounted
    # rather than baked in: an edit here reaches the next request on every
    # Node. `rake dev:tenant` writes a sample one.
    - ./app:/app:ro
    # Stands in for the replicated filesystem the cluster mounts. One volume
    # for all three Nodes, so a write from any of them is there for the next
    # request wherever it lands — replication with a lag of its own arrives
    # when the databases move to libSQL.
    - databases:/data

services:
  proxy:
    image: caddy:2-alpine
    ports:
      # The cluster's one external address. `WORKERS_PORT` moves it, for a
      # machine already running something of its own on 9292.
      - "${WORKERS_PORT:-9292}:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      node-a:
        condition: service_healthy
      node-b:
        condition: service_healthy
      node-c:
        condition: service_healthy

  # `Env.node` reads the hostname the operating system reports, so each Node is
  # given one an operator can recognise rather than a container id.
  node-a:
    <<: *node
    hostname: node-a
    environment:
      <<: *node-environment
      # Designated by configuration, and it does not move with node state.
      WORKERS_WRITER: "true"

  node-b:
    <<: *node
    hostname: node-b
    environment:
      <<: *node-environment
      WORKERS_WRITER: "false"

  node-c:
    <<: *node
    hostname: node-c
    environment:
      <<: *node-environment
      WORKERS_WRITER: "false"

volumes:
  databases:
