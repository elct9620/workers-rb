{{/*
The Hosts. Nothing distinguishes one from another — the same image, the same
configuration, the same directory — so they are replicas rather than members,
and the Pod a request lands on is the Node its `Env.node` reports.

Nothing here waits for the database server. A Host serves every Tenant that
declared no Binding without it, and a Tenant that did declare one is answered
by the Host giving up on a database it cannot reach — which is the behaviour,
not a gap in it.
*/}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "workers.fullname" . }}
  labels:
    {{- include "workers.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.nodes }}
  selector:
    matchLabels:
      {{- include "workers.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "workers.selectorLabels" . | nindent 8 }}
    spec:
      # The image names its user by id, so the kubelet can refuse a Host that
      # would answer requests as root instead of finding out it was one after
      # the untrusted code was already running.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: workers
          image: {{ include "workers.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 9292
          env:
            - name: WORKERS_BASE_DOMAIN
              value: {{ .Values.baseDomain | quote }}
            - name: WORKERS_SHUTDOWN_TIMEOUT
              value: {{ .Values.shutdownTimeoutSeconds | quote }}
            - name: WORKERS_DB_URL
              value: {{ include "workers.db.url" . | quote }}
            - name: WORKERS_DB_ADMIN_URL
              value: {{ include "workers.db.adminUrl" . | quote }}
          # Held until the Host answers once, so the two probes below start
          # counting against a Host that is serving rather than one still
          # coming up. Nothing here waits a fixed delay: a Host slower than
          # this budget is one that never answered, not one answered early.
          #
          # Asked of the liveness path, never readiness: a Host whose mount is
          # unreadable is one that runs and reports itself unfit, and gating
          # its start on readiness would kill it for saying so.
          startupProbe:
            httpGet:
              path: /_health/live
              port: http
            periodSeconds: 5
            failureThreshold: 6
          # Answered from the shared directory as this Host reads it, so a Pod
          # whose mount stopped answering leaves the Service while the rest
          # keep serving. Nothing every Host shares is in it. Failing costs
          # only the requests this Host would have failed anyway, so it is
          # believed sooner than liveness is.
          readinessProbe:
            httpGet:
              path: /_health/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          # Failing this replaces the Host, which hands the replacement the
          # same mount — so it asks no more than that this one is answering,
          # and asks for a minute before believing it is not. A Host serving
          # every request from one bounded set of threads answers this late
          # while those threads wait on a mount (E-14), and replacing it then
          # takes capacity away from a cluster that has none to spare.
          livenessProbe:
            httpGet:
              path: /_health/live
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            # Tenants are published by processes outside the Host, so a Host
            # holds no more of the directory than reading it needs.
            - name: app
              mountPath: /app
              readOnly: true
      # What the stop is allowed to cost: the bound the Host was given, the
      # grace Puma spends over it, the moment it takes to let go, and room
      # past all three.
      #
      # Derived rather than fixed, because reaching the end of this is a kill:
      # a bound raised past a fixed one would be ended by the kill instead of
      # honoured, and the operator who raised it would not be told. Nothing
      # raised leaves this at the 30 seconds Kubernetes would have given.
      terminationGracePeriodSeconds: {{ add .Values.shutdownTimeoutSeconds 20 }}
      volumes:
        - name: app
          persistentVolumeClaim:
            claimName: {{ include "workers.sharedClaim" . }}
