apiVersion: v2
# What the chart is published as, and the last segment of the OCI reference an
# operator installs from. The Host's image is a name under that reference
# rather than the reference itself, so neither has to be read as the other.
name: workers-rb
description: A multi-tenant edge function platform serving untrusted Ruby from a shared directory
type: application

# The chart and the Host it installs are released together, so these two are
# one version, raised by the commits since the last release rather than by
# hand. The markers are where that release puts the new number.
version: 0.1.0 # x-release-please-version

# What `image.tag` defaults to, so an install pulls the Host this chart was
# released with. `0.0.0` names no published image; the first release is what
# gives it one.
appVersion: "0.1.0" # x-release-please-version

home: https://github.com/elct9620/workers-rb
sources:
  - https://github.com/elct9620/workers-rb

# What ties the published chart to this repository. A package that carries it
# takes the repository's visibility, rather than landing private and waiting
# for someone to open it by hand.
annotations:
  org.opencontainers.image.source: https://github.com/elct9620/workers-rb
