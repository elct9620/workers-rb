{{- if not .Values.sharedDirectory.existingClaim }}
{{/*
The shared directory, when the operator asked this chart to claim one rather
than naming a claim they already hold. ReadWriteMany is not a preference here:
it is what lets every Host see the same Tenants, and a class that cannot serve
it leaves the claim pending rather than serving one Host well.
*/}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "workers.sharedClaim" . }}
  labels:
    {{- include "workers.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: {{ .Values.sharedDirectory.storageClass | quote }}
  resources:
    requests:
      storage: {{ .Values.sharedDirectory.size }}
{{- end }}
