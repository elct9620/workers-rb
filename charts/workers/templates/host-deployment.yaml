{{/*
The Hosts. Nothing distinguishes one from another — the same image, the same
configuration, the same directory — so they are replicas rather than members,
and the Pod a request lands on is the Node its `Env.node` reports.

Nothing here waits for the database server. A Host serves every Tenant that
declared no Binding without it, and a Tenant that did declare one is answered
by the Host giving up on a database it cannot reach — which is the behaviour,
not a gap in it.
*/}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "workers.fullname" . }}
  labels:
    {{- include "workers.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.nodes }}
  selector:
    matchLabels:
      {{- include "workers.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "workers.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: workers
          image: {{ include "workers.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 9292
          env:
            - name: WORKERS_BASE_DOMAIN
              value: {{ .Values.baseDomain | quote }}
            - name: WORKERS_DB_URL
              value: {{ include "workers.db.url" . | quote }}
            - name: WORKERS_DB_ADMIN_URL
              value: {{ include "workers.db.adminUrl" . | quote }}
          # Answered from the shared directory as this Host reads it, so a Pod
          # whose mount stopped answering leaves the Service while the rest
          # keep serving. Nothing every Host shares is in it.
          readinessProbe:
            httpGet:
              path: /_health/ready
              port: http
            periodSeconds: 5
          # Failing this replaces the Host, which hands the replacement the
          # same mount — so it asks no more than that this one is answering.
          livenessProbe:
            httpGet:
              path: /_health/live
              port: http
            periodSeconds: 10
            failureThreshold: 3
          volumeMounts:
            # Tenants are published by processes outside the Host, so a Host
            # holds no more of the directory than reading it needs.
            - name: app
              mountPath: /app
              readOnly: true
      volumes:
        - name: app
          persistentVolumeClaim:
            claimName: {{ include "workers.sharedClaim" . }}
