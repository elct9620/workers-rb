# What one process can prove, what only a running cluster can show, and the
# image that cluster runs — in that order, so nothing reaches the registry
# that the suite has not answered for.
name: CI

on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  pull_request:

# A ref needs only its latest run; an earlier one is answering for code
# nobody will ship.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: RuboCop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      # Not part of `rake`, so the suite passing says nothing about style.
      - run: bundle exec rubocop

  test:
    name: Host
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      # The guest binary and the database server are release assets the
      # Rakefile pins, so a hit is byte for byte what a fetch would download.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: vendor
          key: vendor-${{ runner.os }}-${{ hashFiles('Rakefile', 'Gemfile.lock') }}
      - run: bundle exec rake test

  e2e:
    name: Cluster
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      # The shared directory is untracked, and every Node mounts it. Written
      # here first so it belongs to this job rather than to the containers.
      - run: bundle exec rake e2e:publish
      - run: docker compose up -d --wait
      - run: bundle exec rake e2e
      # A cluster that never came up says why in its own logs, not in the
      # suite's timeout.
      - if: failure()
        run: docker compose logs

  # Each architecture is built on a runner of its own architecture. The native
  # gem the sandbox depends on is compiled during the build, and under
  # emulation that compile is what the whole job waits on.
  build:
    name: Image (${{ matrix.arch }})
    needs: [ lint, test, e2e ]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      # A pull request builds to prove the Dockerfile still builds; only a
      # ref that is ours to publish signs in.
      - if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository }}
      # Neither half of the pair is an image anyone should pull, so neither is
      # given a tag: each is pushed under its digest alone, and the tags go on
      # the manifest that names both. A pull request keeps its build in the
      # cache and pushes nothing.
      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: ${{ github.event_name == 'pull_request' && 'type=cacheonly' || format('type=image,name=ghcr.io/{0},push-by-digest=true,name-canonical=true,push=true', github.repository) }}
          # One cache per architecture: a shared scope has each build evicting
          # the layers the other one just wrote.
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
      - if: github.event_name != 'pull_request'
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # The tags an operator pulls, pointing at both builds at once. Nothing is
  # rebuilt here — the digests already in the registry are gathered under one
  # name.
  manifest:
    name: GHCR
    needs: [ build ]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository }}
          # `latest` and `main` follow the branch; a `v*` tag is what an
          # operator pins a cluster to.
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
      - working-directory: /tmp/digests
        run: |
          # Both expansions have to split: one becomes a `-t` per tag, the
          # other a reference per digest. Quoting either passes it as a single
          # argument and the manifest names one thing.
          # shellcheck disable=SC2046
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf 'ghcr.io/${{ github.repository }}@sha256:%s ' *)
