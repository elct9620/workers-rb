# What one process can prove, what only a running cluster can show, what a
# cluster would be asked to install, and the image the branch is followed by —
# in that order, so nothing reaches the registry that the run has not answered
# for. What a release publishes is `release.yml`'s.
name: CI

on:
  push:
    branches: [ main ]
  pull_request:

# A ref needs only its latest run; an earlier one is answering for code
# nobody will ship.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: RuboCop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      # Not part of `rake`, so the suite passing says nothing about style.
      - run: bundle exec rubocop

  test:
    name: Host
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      # The guest binary and the database server are release assets the
      # Rakefile pins, so a hit is byte for byte what a fetch would download.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: vendor
          key: vendor-${{ runner.os }}-${{ hashFiles('Rakefile', 'Gemfile.lock') }}
      - run: bundle exec rake test

  e2e:
    name: Cluster
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      # The shared directory is untracked, and every Node mounts it. Written
      # here first so it belongs to this job rather than to the containers.
      - run: bundle exec rake e2e:publish
      - run: docker compose up -d --wait
      - run: bundle exec rake e2e
      # A cluster that never came up says why in its own logs, not in the
      # suite's timeout.
      - if: failure()
        run: docker compose logs

  # Nothing in the suite renders a template, so what an operator can ask this
  # chart for — and what it has to refuse — is answered here or in their
  # cluster. The image waits on it: the chart and the image it installs are
  # one release, and this is where a release candidate answers for both.
  chart:
    name: Chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - run: bundle exec rake chart:check

  # One platform per runner, so the native gem the sandbox depends on is
  # compiled rather than emulated — under emulation that compile is what the
  # whole job waits on. Docker's workflow distributes the builds, pushes each
  # under its digest, and gathers them under the tags below; a pull request
  # builds without pushing, which is what proves the Dockerfile still builds.
  publish:
    name: GHCR
    needs: [ lint, test, e2e, chart ]
    permissions:
      contents: read
      packages: write
      # Provenance attestations and cache entries are signed with GitHub OIDC.
      id-token: write
    uses: docker/github-builder/.github/workflows/build.yml@27ade872c1e2296e62ef15ab3b10d37665e57cf7 # v1
    with:
      output: image
      push: ${{ github.event_name != 'pull_request' }}
      platforms: linux/amd64,linux/arm64
      cache: true
      cache-mode: max
      set-meta-labels: true
      meta-images: ghcr.io/${{ github.repository }}
      # `latest` and `main` follow the branch. The version an operator pins a
      # cluster to is not here: it names a release, and a release is not a
      # branch reaching the registry again.
      meta-tags: |
        type=ref,event=branch
        type=sha
        type=raw,value=latest,enable={{is_default_branch}}
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
